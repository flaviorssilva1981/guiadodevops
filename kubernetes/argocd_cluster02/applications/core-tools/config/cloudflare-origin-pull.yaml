apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-origin-pull
  namespace: argocd
spec:
  project: core-tools-config
  source:
    repoURL: https://github.com/flaviorssilva1981/guiadodevops.git
    path: kubernetes/argocd_cluster02/config/core-tools/cloudflare-origin-pull
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
      selfHeal: true
