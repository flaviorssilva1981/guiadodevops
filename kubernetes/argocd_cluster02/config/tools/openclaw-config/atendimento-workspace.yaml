    # CONTEXT.md — Dublin Consulting

    Fonte: https://dublinconsulting.com.br (home, 7 páginas de solução, /diagnostico-exemplo e
    /privacidade, lidos em 2026-10-02) e PRODUCT.md do repositório devops-portfolio. Use como
    base factual; nunca invente o que não está aqui (clientes, números, depoimentos, preços além
    dos listados). O site muda: em dúvida sobre o conteúdo atual, busque a página (web fetch) e
    avise o Chaves se divergir deste texto.

    ## Empresa
    Dublin Consulting: consultoria de **Cloud, DevOps e Kubernetes**.
    Slogan: "Cloud e DevOps inteligentes, operação segura."
    Proposta: arquitetura, automação DevOps e soluções de IA em AWS, Azure, GCP e OCI, com
    segurança por padrão e mudanças reversíveis. Lema: "Diagnosticamos antes de mudar,
    automatizamos o que se repete e operamos com segurança."
    Valores: Transparência (mostrar o plano antes de mudar), Colaboração (trabalhar junto ao
    time do cliente), Autonomia (entregar documentação e runbooks); diagnóstico antes de
    mudança, mudanças reversíveis, segurança por padrão, documentação viva.
    Público: empresas de médio porte no Brasil (CTO, gerente de engenharia, líder de TI) com
    problema de infraestrutura, Kubernetes, custo de cloud ou pipeline de entrega.

    ## Fundador
    **Flavio Silva**, engenheiro DevOps sênior, 15 anos de experiência (infraestrutura
    on-premises, cloud, DevOps, FinOps e IA). Certificações: AWS Solutions Architect Associate,
    Microsoft Azure Fundamentals (AZ-900), Google Cloud Digital Leader, Oracle Cloud
    Infrastructure Architect Associate. Não há equipe divulgada além do fundador.

    ## Serviços (7 frentes; página de cada uma em /solucoes/<nome>.html)
    **1. Cloud & Multi-cloud** (cloud.html): arquitetura, migração e governança em AWS, Azure,
    Google Cloud e OCI. Entregas: arquitetura multi-cloud sem lock-in desnecessário; migração
    (avaliação, plano reversível, cutover com mínimo de indisponibilidade); governança e
    tagging; FinOps (custos, rightsizing, controles); redes e acessos (VPC/VNet, firewall,
    allowlists documentadas); documentação do ambiente. Processo: avaliação, arquitetura e
    riscos, infraestrutura como código, validação e handover documentado.

    **2. Kubernetes & Containers** (kubernetes.html): desenho e operação de clusters EKS, AKS,
    GKE e OKE. Entregas: clusters gerenciados; Helm e Kustomize; rollouts seguros
    (maxUnavailable 0, probes, rollback previsível); autoscaling (HPA); RBAC por namespace sem
    cluster-admin; imagens sem root e com filesystem somente leitura. Processo: leitura do
    cluster, padrão de manifests/charts, pipeline de deploy com rollout controlado,
    observabilidade e runbooks. Migração de VMs para containers é incremental. O próprio site
    da Dublin roda em OKE, com HPA e deploy por pipeline.

    **3. CI/CD & Automação** (cicd.html): pipelines rápidos, auditáveis e com rollback
    previsível. Entregas: GitHub Actions (permissões mínimas, deploy por ambiente); migração de
    jobs Jenkins para Bitbucket/GitHub com validação paralela; Bitbucket Pipelines (deploy por
    SSH com allowlists); Azure DevOps e CodePipeline; GitOps com Argo CD; deploy de CMS (Drupal,
    WordPress, Pantheon, Acquia via Composer e Drush). Processo: mapa de jobs, branches e
    segredos; pipeline como está, sem mudar comportamento; variáveis e permissões mínimas; PRs
    somente de pipeline, com validação. Segredos ficam nos secrets do provedor, nunca no
    repositório; pipeline e código da aplicação ficam separados.

    **4. Infraestrutura como Código** (iac.html): Terraform e Ansible com plan antes de apply,
    módulos versionados e ambientes reproduzíveis de dev a produção. Entregas: Terraform modular
    com estado remoto protegido; plan revisado antes de todo apply; Ansible idempotente;
    paridade dev/uat/prod; detecção de drift; inventário e documentação. Processo: levantamento,
    importação e modelagem em módulos, plan revisado em PR, apply aprovado e documentado. Não
    há apply automático: só após aprovação explícita. Importa infraestrutura existente de forma
    gradual.

    **5. DevSecOps** (devsecops.html): segredos fora do git, RBAC/IAM com menor privilégio e
    verificações automatizadas. Entregas: gestão de segredos (cofres); IAM e RBAC; scans no
    pipeline (imagens e dependências); hardening de containers (não-root, capabilities
    removidas, seccomp, rootfs somente leitura); rotação e revogação; revisão de riscos com plano
    priorizado. Ferramentas: SonarQube, Trivy, Vault, Wazuh, Loki, WAF. Não faz pentest: o foco
    é hardening e automação.

    **6. Observabilidade** (observabilidade.html): visibilidade de saúde, performance e custo,
    com alertas que importam. Entregas: métricas (Prometheus); dashboards (Grafana); Zabbix para
    legado; alertas acionáveis baseados em SLO; análise de eventos de Kubernetes e causa raiz;
    visão de custo. Ferramentas também: Sentry e New Relic. Processo: levantar o existente,
    definir SLIs/SLOs, dashboards e alertas, runbooks e revisão. Integra ferramentas existentes;
    modelo de plantão (on-call) é negociado caso a caso.

    **7. Soluções de IA** (ia.html): agentes e automações com IA aplicados à operação, com MCP,
    RAG sobre a documentação do cliente e guardrails de acesso. Entregas: agentes de AIOps;
    integração via MCP (Kubernetes, nuvem, pipelines, observabilidade); RAG com fontes citadas;
    assistentes conversacionais (incluindo voz com Gemini Live); guardrails (leitura primeiro,
    escrita só com aprovação, credenciais fora dos prompts); multi-modelo (Claude, GPT, Gemini).
    Não há execução autônoma em produção por padrão: começa em leitura e ações exigem aprovação.
    Local, provedores e proteção de dados são decididos junto com o cliente.

    ## Método (6 etapas)
    Diagnóstico, Arquitetura, Infraestrutura, Automação, Testes, Entrega.

    ## Diagnóstico (oferta de entrada)
    5 dias úteis, acesso somente leitura; relatório de riscos priorizados + roadmap de 90 dias;
    cobre arquitetura e resiliência, segurança (IAM, RBAC, segredos), custos e desperdícios
    (FinOps), pipelines de CI/CD, Kubernetes e observabilidade. A partir de **R$ 7.500** (um
    ambiente, uma cloud); o valor é **abatido** se o cliente contratar a implementação. Primeira
    conversa de 30 minutos gratuita. Outros escopos e valores: decisão do Flavio, não estime.
    Exemplo **fictício** em /diagnostico-exemplo: avaliação de 5 dias úteis de 2 contas AWS
    (produção e homologação), cluster EKS com 14 serviços, PostgreSQL gerenciado e GitHub
    Actions; 6 riscos priorizados (R1 a R6; 3 altos: gestão de chaves AWS, testes de backup,
    alertas de incidentes; 3 médios); 15% a 20% do gasto mensal em recursos ociosos; 12 dos 14
    serviços com deploy automatizado; ganhos rápidos em 2 semanas (federação OIDC, testes de
    restore, rightsizing); roadmap de 90 dias em 3 fases de 30. Não são dados de cliente.

    ## Casos (anonimizados; nunca nomear clientes)
    - FinOps: multi-cloud com custos difíceis de atribuir; cerca de 25% a menos no custo mensal
      de cloud, via governança, tagging e controles.
    - Kubernetes: aplicações em VMs; deploy automatizado e infraestrutura reproduzível via código.
    - Cloud: migração de on-premises para a AWS; cargas em produção na AWS.
    - AIOps: eventos de Kubernetes exigiam investigação manual; relatório de causa raiz e
      correção só com aprovação do operador.
    - OpenClaw: agente de IA auto-hospedado em Kubernetes; todas as mudanças via pull request e
      Argo CD mantém o cluster igual ao Git.
    Não há outros números, setores, prazos ou depoimentos confirmados.

    ## Stack
    Clouds: AWS, Azure, Google Cloud, Oracle Cloud. Plataforma: Kubernetes, Docker, Helm, Argo
    CD. IaC/automação: Terraform, CloudFormation, Ansible, Jenkins, GitHub Actions, GitLab CI,
    Bitbucket Pipelines, Azure DevOps, CodePipeline. Segurança: Trivy, SonarQube, Vault, Wazuh,
    WAF. Observabilidade: Prometheus, Grafana, Loki, Zabbix, Sentry, New Relic. IA: Claude,
    OpenAI GPT, Gemini, Grok, AWS Bedrock, OpenClaw, Agent Skills, MCP, RAG. Outros: Python,
    Bash, PowerShell, CMS (Drupal, WordPress, Pantheon, Acquia).

