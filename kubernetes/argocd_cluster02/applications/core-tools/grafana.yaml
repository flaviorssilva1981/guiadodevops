apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd     
spec:
  project: core-tools
  source:
    repoURL: harbor.guiadodevops.com
    targetRevision: 9.2.10
    helm:
      values: |-
        replicaCount: 1
        # Pin admin creds to a Vault-backed secret (ExternalSecret grafana-admin
        # in config/core-tools/grafana-config/, synced to grafana-admin-credentials).
        # Without this the chart auto-generates its own `grafana` secret and
        # regenerates admin-password on Helm/Argo syncs, while Grafana's DB on the
        # PVC keeps whatever was seeded on first boot - so the stored secret drifts
        # out of sync with the real login. existingSecret also stops the chart
        # creating that throwaway secret at all.
        admin:
          existingSecret: grafana-admin-credentials
          userKey: admin-user
          passwordKey: admin-password
        # RWO PVC (oci-bv) cannot multi-attach across nodes during RollingUpdate
        deploymentStrategy:
          type: Recreate
        readinessProbe:
          initialDelaySeconds: 15
        ingress:
          enabled: true
          ingressClassName: nginx
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt"
            external-dns.alpha.kubernetes.io/hostname: dublinconsulting.com.br
            external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
          hosts:
            - grafana.dublinconsulting.com.br
          path: /
          tls:
          - secretName: grafana-tls
            hosts:
              - grafana.dublinconsulting.com.br
        persistence:
          enabled: true
          storageClassName: "oci-bv"
          size: 10Gi
          accessModes:
            - ReadWriteOnce
        readinessProbe:
          initialDelaySeconds: 15
        sidecar:
          alerts:
            enabled: true
          dashboards:
            enabled: true
          datasources:
            enabled: true
          plugins:
            enabled: true
          notifiers:
            enabled: true
    chart: infra/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true 
      selfHeal: true
