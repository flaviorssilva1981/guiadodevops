name: CI/CD - eurotrip2026

# Static site (no app logic), so no SonarQube gate here — just build, push,
# and bump the image tag consumed by kubernetes/argocd_cluster02/config/eurotrip2026/manifests.
# Argo CD app-of-apps picks up the tag bump automatically (selfHeal enabled).

on:
  push:
    branches: [main]
    paths:
      - 'kubernetes/argocd_cluster02/config/eurotrip2026/app/**'
      - 'kubernetes/argocd_cluster02/config/eurotrip2026/manifests/**'
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: eurotrip2026
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      APP_PATH: kubernetes/argocd_cluster02/config/eurotrip2026/app
      MANIFESTS_PATH: kubernetes/argocd_cluster02/config/eurotrip2026/manifests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.APP_PATH }}
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Update Rollout image tag
        run: |
          sed -i "s|image: .*|image: docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}|" ${{ env.MANIFESTS_PATH }}/deployment.yaml

      - name: Commit and Push manifests
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add ${{ env.MANIFESTS_PATH }}/deployment.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: update eurotrip2026 image tag to ${{ steps.vars.outputs.sha_short }}"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
