apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boutique-frontend
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt"
    external-dns.alpha.kubernetes.io/hostname: boutique.dublinconsulting.com.br
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    # Origin lock: accept TLS clients only with Cloudflare's origin-pull certificate (mTLS).
    nginx.ingress.kubernetes.io/auth-tls-secret: "boutique/cloudflare-origin-pull-ca"
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "false"
spec:
  tls:
    - hosts:
        - boutique.dublinconsulting.com.br
      secretName: tls-boutique
  rules:
    - host: boutique.dublinconsulting.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
