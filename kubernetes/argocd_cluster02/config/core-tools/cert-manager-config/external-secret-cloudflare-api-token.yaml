# Cloudflare API token for cert-manager DNS-01 (same scoped token external-dns uses:
# Zone:DNS:Edit + Zone:Zone:Read on dublinconsulting.com.br). Lives in the cert-manager
# namespace because the ClusterIssuer reads it from the cluster resource namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: security
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
  dataFrom:
    - extract:
        key: external-dns-provider-cloudflare
