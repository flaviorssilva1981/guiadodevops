apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw
  namespace: argocd
spec:
  project: tools
  source:
    # NOTE: sourced directly from the community chart repo (not harbor.guiadodevops.com/infra/*
    # like other Helm apps in this cluster) because this chart is not yet mirrored into Harbor.
    # To align with cluster convention later: mirror serhanekicii/openclaw-helm into
    # harbor.guiadodevops.com/infra/openclaw and swap repoURL/chart back to the harbor pattern.
    repoURL: https://serhanekicii.github.io/openclaw-helm
    targetRevision: 1.5.40
    chart: openclaw
    helm:
      values: |-
        app-template:
          # Chart default (1.5.40) is 2026.5.22; pinned forward to 2026.7.1-2 (latest
          # stable, chart itself has had no release since 2026.5.22) because the
          # in-cluster agent needs the memory-index schema introduced in 2026.7.1-1
          # (see that release's "Memory Core startup repair" note) for a downstream
          # skill-pack installer that checks for it via `openclaw memory status --json`.
          openclawVersion: "2026.7.1-2"
          # merge (not overwrite): the init-config deep-merge preserves the runtime
          # `meta` block that OpenClaw's Memory Core startup-repair validates. overwrite
          # `cp`s a meta-less file, which Memory Core rejects on boot and "auto-restores
          # from backup" (reverting to the old requesty config) - that fought every
          # provider change. With merge, the chart's `agents.defaults.model.primary` and
          # `models.providers.anthropic` are re-applied on every boot and stick; the
          # ignoreDifferences block below keeps ArgoCD from fighting the merged state.
          configMode: merge
          # No ClawHub skills auto-installed on startup (least-privilege default).
          skills: []
          defaultPodOptions:
            annotations:
              reloader.stakater.com/auto: "true"
          controllers:
            main:
              initContainers:
                # The PVC mount root (/home/node/.openclaw) was left root-owned from
                # before this chart's non-root securityContext was in place; k8s only
                # chowns a volume root on fsGroup *mismatch* (OnRootMismatch), and the
                # group here already matched, so the stale owning user was never fixed.
                # OpenClaw's exec tool chmods this directory before running any shell
                # command, so a stale root-owned root causes EPERM on every exec call
                # even though file read/write inside it works fine. Fix once here.
                # NOTE: runAsUser 1000 + capabilities.add:[CHOWN] (drop:ALL) was tried
                # first and failed with the same EPERM - the added capability did not
                # take effect for this non-root process on this cluster's runtime
                # (likely an ambient-capability propagation gap across the sh -c ->
                # chown exec chain). Running this one short-lived step as literal root
                # with the runtime's default capability set (no add/drop override) is
                # the standard, proven pattern other charts use for this exact
                # volume-ownership-fix case.
                fix-permissions:
                  image:
                    repository: ghcr.io/openclaw/openclaw
                    tag: "{{ .Values.openclawVersion }}"
                  command:
                    - sh
                    - -c
                    - chown 1000:1000 /home/node/.openclaw
                  securityContext:
                    runAsUser: 0
                    runAsGroup: 0
                    runAsNonRoot: false
                    readOnlyRootFilesystem: true
                    allowPrivilegeEscalation: false
              containers:
                main:
                  envFrom:
                    - secretRef:
                        name: openclaw-env-secret
                  # Bumped from the chart default (200m/512Mi, sized for a single agent)
                  # to cover multiple agents running concurrently in this single-instance
                  # gateway (OpenClaw does not support horizontal scaling, so capacity for
                  # more agents.list entries must come from tuning this vertically).
                  resources:
                    requests:
                      cpu: 500m
                      memory: 1Gi
                    limits:
                      cpu: "4"
                      memory: 4Gi
                chromium:
                  # Browser automation not needed for a Telegram chat agent; disabled to cut
                  # resource use and attack surface.
                  enabled: false
          configMaps:
            config:
              data:
                openclaw.json: |
                  {
                    "gateway": {
                      "port": 18789,
                      "mode": "local",
                      "trustedProxies": ["10.0.0.1"],
                      "controlUi": {
                        "allowedOrigins": [
                          "https://openclaw.dublinconsulting.com.br",
                          "http://localhost:18789",
                          "http://127.0.0.1:18789"
                        ]
                      }
                    },

                    "browser": {
                      "enabled": false
                    },

                    "agents": {
                      "defaults": {
                        "workspace": "/home/node/.openclaw/workspace",
                        "model": {
                          "primary": "anthropic/claude-sonnet-5"
                        },
                        "userTimezone": "UTC",
                        "timeoutSeconds": 600,
                        "maxConcurrent": 3,
                        "memorySearch": {
                          "provider": "none",
                          "store": {
                            "vector": {
                              "enabled": false
                            }
                          }
                        }
                      },
                      "list": [
                        {
                          "id": "chaves",
                          "default": true,
                          "identity": {
                            "name": "Chaves",
                            "emoji": "👔"
                          },
                          "tools": { "profile": "full" },
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        },
                        {
                          "id": "chiquinha",
                          "name": "Chiquinha",
                          "workspace": "/home/node/.openclaw/workspaces/chiquinha",
                          "tools": { "profile": "full" },
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        },
                        {
                          "id": "dona-florinda",
                          "name": "Dona Florinda",
                          "workspace": "/home/node/.openclaw/workspaces/dona-florinda",
                          "tools": { "profile": "full" },
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        },
                        {
                          "id": "kiko",
                          "name": "Kiko",
                          "workspace": "/home/node/.openclaw/workspaces/kiko",
                          "tools": { "profile": "full" },
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        },
                        {
                          "id": "senhor-barriga",
                          "name": "Senhor Barriga",
                          "workspace": "/home/node/.openclaw/workspaces/senhor-barriga",
                          "tools": { "profile": "full" },
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        },
                        {
                          "id": "professor-girafales",
                          "name": "Professor Girafales",
                          "workspace": "/home/node/.openclaw/workspaces/professor-girafales",
                          "tools": { "profile": "full" },
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        },
                        {
                          "id": "seu-madruga",
                          "name": "Seu Madruga",
                          "workspace": "/home/node/.openclaw/workspaces/seu-madruga",
                          "tools": { "profile": "full" },
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        },
                        {
                          "id": "bruxa-do-71",
                          "name": "Bruxa do 71",
                          "workspace": "/home/node/.openclaw/workspaces/bruxa-do-71",
                          "tools": { "profile": "full" },
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        },
                        {
                          "id": "chapolin",
                          "name": "Chapolin",
                          "workspace": "/home/node/.openclaw/workspaces/chapolin",
                          "tools": { "profile": "full" },
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        }
                      ]
                    },

                    "models": {
                      "providers": {
                        "anthropic": {
                          "baseUrl": "https://api.anthropic.com",
                          "apiKey": "${ANTHROPIC_API_KEY}",
                          "api": "anthropic-messages",
                          "headers": {
                            "anthropic-workspace-id": "wrkspc_01GSzMHTV7Y7S6H2Uza33Vg7"
                          },
                          "models": [
                            {
                              "id": "claude-sonnet-5",
                              "name": "Claude Sonnet 5",
                              "contextWindow": 200000,
                              "maxTokens": 64000
                            }
                          ]
                        }
                      }
                    },

                    "session": {
                      "scope": "per-sender",
                      "store": "/home/node/.openclaw/sessions",
                      "reset": {
                        "mode": "idle",
                        "idleMinutes": 60
                      }
                    },

                    "logging": {
                      "level": "info",
                      "consoleLevel": "info",
                      "consoleStyle": "compact",
                      "redactSensitive": "tools"
                    },

                    "tools": {
                      "profile": "full",
                      "agentToAgent": {
                        "enabled": true,
                        "allow": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"]
                      },
                      "sessions": {
                        "visibility": "all"
                      },
                      "web": {
                        "search": {
                          "enabled": false
                        },
                        "fetch": {
                          "enabled": true
                        }
                      }
                    },

                    "channels": {
                      "telegram": {
                        "botToken": "${TELEGRAM_BOT_TOKEN}",
                        "enabled": true
                      }
                    }
                  }
          ingress:
            main:
              enabled: true
              className: nginx
              annotations:
                cert-manager.io/cluster-issuer: "letsencrypt"
                external-dns.alpha.kubernetes.io/hostname: dublinconsulting.com.br
                external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
                nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
                nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
              hosts:
                - host: openclaw.dublinconsulting.com.br
                  paths:
                    - path: /
                      pathType: Prefix
                      service:
                        identifier: main
                        port: http
              tls:
                - secretName: openclaw-tls
                  hosts:
                    - openclaw.dublinconsulting.com.br
          persistence:
            data:
              storageClass: oci-bv
              advancedMounts:
                main:
                  fix-permissions:
                    - path: /home/node/.openclaw
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-agents
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: openclaw
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
