apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  # Admin creds change rarely; no need for the 15s cadence used elsewhere.
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    template:
      type: Opaque
  data:
    # Vault KV v2 at secret/grafana. Keep admin-password equal to the value the
    # live Grafana DB already has (reset 2026-08-29) so this changeover is a
    # no-op; picking a new value here would only seed a fresh DB, not update the
    # existing one on the PVC.
    - secretKey: admin-user
      remoteRef:
        key: grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: grafana
        property: admin-password
