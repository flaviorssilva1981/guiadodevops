apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw
  namespace: argocd
spec:
  project: tools
  source:
    # NOTE: sourced directly from the community chart repo (not harbor.guiadodevops.com/infra/*
    # like other Helm apps in this cluster) because this chart is not yet mirrored into Harbor.
    # To align with cluster convention later: mirror serhanekicii/openclaw-helm into
    # harbor.guiadodevops.com/infra/openclaw and swap repoURL/chart back to the harbor pattern.
    repoURL: https://serhanekicii.github.io/openclaw-helm
    targetRevision: 1.5.40
    chart: openclaw
    helm:
      values: |-
        app-template:
          # Chart default (1.5.40) is 2026.5.22; pinned forward to 2026.7.1-2 (latest
          # stable, chart itself has had no release since 2026.5.22) because the
          # in-cluster agent needs the memory-index schema introduced in 2026.7.1-1
          # (see that release's "Memory Core startup repair" note) for a downstream
          # skill-pack installer that checks for it via `openclaw memory status --json`.
          openclawVersion: "2026.7.1-2"
          # merge (not overwrite): the init-config deep-merge preserves the runtime
          # `meta` block that OpenClaw's Memory Core startup-repair validates. overwrite
          # `cp`s a meta-less file, which Memory Core rejects on boot and "auto-restores
          # from backup" (reverting to the old requesty config) - that fought every
          # provider change. With merge, the chart's `agents.defaults.model.primary` and
          # `models.providers.openai` are re-applied on every boot and stick; the
          # ignoreDifferences block below keeps ArgoCD from fighting the merged state.
          configMode: merge
          # No ClawHub skills auto-installed on startup (least-privilege default).
          skills: []
          defaultPodOptions:
            annotations:
              reloader.stakater.com/auto: "true"
          controllers:
            main:
              initContainers:
                # The PVC mount root (/home/node/.openclaw) was left root-owned from
                # before this chart's non-root securityContext was in place; k8s only
                # chowns a volume root on fsGroup *mismatch* (OnRootMismatch), and the
                # group here already matched, so the stale owning user was never fixed.
                # OpenClaw's exec tool chmods this directory before running any shell
                # command, so a stale root-owned root causes EPERM on every exec call
                # even though file read/write inside it works fine. Fix once here.
                # NOTE: runAsUser 1000 + capabilities.add:[CHOWN] (drop:ALL) was tried
                # first and failed with the same EPERM - the added capability did not
                # take effect for this non-root process on this cluster's runtime
                # (likely an ambient-capability propagation gap across the sh -c ->
                # chown exec chain). Running this one short-lived step as literal root
                # with the runtime's default capability set (no add/drop override) is
                # the standard, proven pattern other charts use for this exact
                # volume-ownership-fix case.
                fix-permissions:
                  image:
                    repository: ghcr.io/openclaw/openclaw
                    tag: "{{ .Values.openclawVersion }}"
                  command:
                    - sh
                    - -c
                    - chown 1000:1000 /home/node/.openclaw
                  securityContext:
                    runAsUser: 0
                    runAsGroup: 0
                    runAsNonRoot: false
                    readOnlyRootFilesystem: true
                    allowPrivilegeEscalation: false
              containers:
                main:
                  envFrom:
                    - secretRef:
                        name: openclaw-env-secret
                  # Bumped from the chart default (200m/512Mi, sized for a single agent)
                  # to cover multiple agents running concurrently in this single-instance
                  # gateway (OpenClaw does not support horizontal scaling, so capacity for
                  # more agents.list entries must come from tuning this vertically).
                  resources:
                    requests:
                      cpu: 500m
                      memory: 1Gi
                    limits:
                      cpu: "4"
                      memory: 4Gi
                  # (Re)launch the Claw3D Studio process on every pod start. Claw3D
                  # is installed on the PVC (/home/node/.openclaw/claw3d-openclaw-studio,
                  # HOST=0.0.0.0 / TUNNEL_ENABLED=0 in its state/config.env) and
                  # fronted by the openclaw-claw3d Service/Ingress, but it runs as a
                  # plain setsid process, not a container - without this it stayed
                  # dead after a restart until someone ran `claw3dctl start` by hand.
                  # The hook backgrounds the launch and always exits 0: a non-zero
                  # postStart would kill the gateway container. HOME must be an
                  # explicit writable path (image $HOME=/home/node is read-only).
                  lifecycle:
                    postStart:
                      exec:
                        command:
                          - sh
                          - -c
                          - |
                            CTL=/home/node/.openclaw/claw3d-openclaw-studio/bin/claw3dctl
                            [ -x "$CTL" ] || exit 0
                            HOME=/home/node/.openclaw/claw3d-home \
                            OPENCLAW_STATE_DIR=/home/node/.openclaw \
                              setsid "$CTL" start >/tmp/claw3d-poststart.log 2>&1 &
                            exit 0
                chromium:
                  # Browser automation not needed for a Telegram chat agent; disabled to cut
                  # resource use and attack surface.
                  enabled: false
          # NOTE (agents.defaults.heartbeat.every: "0"): OpenClaw's heartbeat is ON by
          # default for the default agent (chaves) at a 30-min interval even with no
          # heartbeat block. Each poll submits a full model turn to openai/gpt-5.5
          # (reads HEARTBEAT.md, calls heartbeat_respond), so it burned the OpenAI
          # key ~48x/day with no user activity. HEARTBEAT.md is empty and there are
          # no periodic tasks to run, so the heartbeat is disabled: every "0" makes
          # resolveHeartbeatIntervalMs() return null and the heartbeat-runner skips
          # scheduling. Re-enable by setting a duration (e.g. "30m") if periodic
          # agent wake-ups are ever needed.
          #
          # NOTE (api: openai-completions + "reasoning": false on requesty gpt-5.5):
          # the OpenAI *Responses* API returns an encrypted reasoning blob
          # (reasoning.encrypted_content) that must be replayed on the next turn.
          # Those blobs are bound to the backend OpenAI key/context that minted
          # them; Requesty load-balances across backend keys, so a multi-turn
          # conversation whose turns land on different backends fails replay with
          # 400 "encrypted content ... could not be verified" (OpenClaw's
          # auto-recovery regex doesn't match Requesty's wording, so no self-heal).
          # `reasoning: false` alone did NOT stop it (the responses transport still
          # requested reasoning). Switching to the Chat Completions transport
          # (api: openai-completions -> client.chat.completions, /v1/chat/completions)
          # removes the encrypted-reasoning replay path entirely - the wrapper only
          # applies to openai-responses / openai-chatgpt-responses. Tool calling
          # verified working through Requesty on chat/completions. GPT-5.5 still
          # reasons server-side; the CoT blob is simply not round-tripped.
          # Session transcripts were also reset once (sessions-backup-*.tar.gz on
          # the PVC) to drop the already-poisoned history.
          #
          # NOTE (no tools.media.audio): Telegram voice-note transcription is
          # disabled - it needs a transcription model, and the company's Requesty
          # allowlist has none approved (chat models only, none accept audio in).
          # A tools.media.audio.models -> requesty/openai/whisper-1 block was tried
          # (#192) and reverted (#194) because the router returns 403 "not approved
          # for this API key". Re-add it if a transcription model is ever approved,
          # or point it at a non-Requesty STT provider.
          configMaps:
            config:
              data:
                openclaw.json: |
                  {
                    "gateway": {
                      "port": 18789,
                      "mode": "local",
                      "trustedProxies": ["10.0.0.1"],
                      "controlUi": {
                        "allowedOrigins": [
                          "https://openclaw.dublinconsulting.com.br",
                          "http://localhost:18789",
                          "http://127.0.0.1:18789"
                        ]
                      }
                    },

                    "browser": {
                      "enabled": false
                    },

                    "agents": {
                      "defaults": {
                        "workspace": "/home/node/.openclaw/workspace",
                        "model": {
                          "primary": "requesty/openai/gpt-5.5"
                        },
                        "userTimezone": "UTC",
                        "timeoutSeconds": 600,
                        "maxConcurrent": 3,
                        "heartbeat": {
                          "every": "0"
                        },
                        "memorySearch": {
                          "provider": "none",
                          "store": {
                            "vector": {
                              "enabled": false
                            }
                          }
                        }
                      },
                      "list": [
                        {
                          "id": "chaves",
                          "default": true,
                          "identity": {
                            "name": "Chaves",
                            "emoji": "👔"
                          },
                          "tools": { "profile": "full" },
                          "skills": ["time-chaves-operating-system","team-bundle-installer","web-research-with-sources","market-research","business-health-diagnostic","scenario-planning","idea-scoring","executive-briefing","presentation-builder","professional-report-builder","document-builder"],
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        },
                        {
                          "id": "chiquinha",
                          "name": "Chiquinha",
                          "workspace": "/home/node/.openclaw/workspaces/chiquinha",
                          "tools": { "profile": "full" },
                          "skills": ["time-chaves-operating-system","web-research-with-sources","document-builder","diagram-maker","architecture-review","api-testing","security-review","webapp-testing"],
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        },
                        {
                          "id": "dona-florinda",
                          "name": "Dona Florinda",
                          "workspace": "/home/node/.openclaw/workspaces/dona-florinda",
                          "tools": { "profile": "full" },
                          "skills": ["time-chaves-operating-system","web-research-with-sources","document-builder","creative-ideation","idea-scoring","concept-visualizer","premium-visual-experience","visual-design-system","scenario-planning","market-research"],
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        },
                        {
                          "id": "kiko",
                          "name": "Kiko",
                          "workspace": "/home/node/.openclaw/workspaces/kiko",
                          "tools": { "profile": "full" },
                          "skills": ["time-chaves-operating-system","web-research-with-sources","document-builder","market-research","ad-creative","cro-seo-analytics","conversion-copywriting","product-marketing-context","social-intelligence","pricing-launch-strategy","idea-scoring"],
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        },
                        {
                          "id": "senhor-barriga",
                          "name": "Senhor Barriga",
                          "workspace": "/home/node/.openclaw/workspaces/senhor-barriga",
                          "tools": { "profile": "full" },
                          "skills": ["time-chaves-operating-system","web-research-with-sources","document-builder","cashflow-dre","financial-modeling","unit-economics-budgeting","spreadsheet-analyst","professional-report-builder","business-health-diagnostic","scenario-planning"],
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        },
                        {
                          "id": "professor-girafales",
                          "name": "Professor Girafales",
                          "workspace": "/home/node/.openclaw/workspaces/professor-girafales",
                          "tools": { "profile": "full" },
                          "skills": ["time-chaves-operating-system","web-research-with-sources","document-builder","sales-discovery","sales-enablement","objection-pipeline-forecast","presentation-builder","pricing-launch-strategy","product-marketing-context"],
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        },
                        {
                          "id": "seu-madruga",
                          "name": "Seu Madruga",
                          "workspace": "/home/node/.openclaw/workspaces/seu-madruga",
                          "tools": { "profile": "full" },
                          "skills": ["time-chaves-operating-system","web-research-with-sources","document-builder","brazilian-legal-research","contract-lgpd-review","legal-risk-visual-law","professional-report-builder"],
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        },
                        {
                          "id": "bruxa-do-71",
                          "name": "Bruxa do 71",
                          "workspace": "/home/node/.openclaw/workspaces/bruxa-do-71",
                          "tools": { "profile": "full" },
                          "skills": ["time-chaves-operating-system","web-research-with-sources","document-builder","conversion-copywriting","copy-critic","ad-creative","vsl-video-script","product-marketing-context"],
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        },
                        {
                          "id": "chapolin",
                          "name": "Chapolin",
                          "workspace": "/home/node/.openclaw/workspaces/chapolin",
                          "tools": { "profile": "full" },
                          "skills": ["time-chaves-operating-system","web-research-with-sources","document-builder","marketplace-research","margin-listing-optimizer","inventory-competitor-go-no-go","pricing-launch-strategy","unit-economics-budgeting","cro-seo-analytics"],
                          "subagents": { "allowAgents": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"] }
                        }
                      ]
                    },

                    "models": {
                      "providers": {
                        "requesty": {
                          "baseUrl": "https://router.requesty.ai/v1",
                          "apiKey": "${REQUESTY_API_KEY}",
                          "api": "openai-completions",
                          "models": [
                            {
                              "id": "openai/gpt-5.5",
                              "name": "GPT-5.5 (via Requesty)",
                              "contextWindow": 272000,
                              "maxTokens": 128000,
                              "reasoning": false
                            }
                          ]
                        }
                      }
                    },

                    "session": {
                      "scope": "per-sender",
                      "store": "/home/node/.openclaw/sessions",
                      "reset": {
                        "mode": "idle",
                        "idleMinutes": 60
                      }
                    },

                    "logging": {
                      "level": "info",
                      "consoleLevel": "info",
                      "consoleStyle": "compact",
                      "redactSensitive": "tools"
                    },

                    "tools": {
                      "profile": "full",
                      "agentToAgent": {
                        "enabled": true,
                        "allow": ["chaves","chiquinha","dona-florinda","kiko","senhor-barriga","professor-girafales","seu-madruga","bruxa-do-71","chapolin"]
                      },
                      "sessions": {
                        "visibility": "all"
                      },
                      "web": {
                        "search": {
                          "enabled": false
                        },
                        "fetch": {
                          "enabled": true
                        }
                      }
                    },

                    "channels": {
                      "telegram": {
                        "botToken": "${TELEGRAM_BOT_TOKEN}",
                        "enabled": true
                      }
                    }
                  }
          # Second Service for the Claw3D Studio (github.com/iamlukethedev/Claw3D).
          # Claw3D is not part of this chart - it is installed once onto the PVC and
          # runs as an unmanaged sidecar *process* inside the openclaw pod, bound to
          # 0.0.0.0:3001 (HOST=0.0.0.0, TUNNEL_ENABLED=0 in its state/config.env).
          # This Service + the claw3d ingress below front it with the cluster's own
          # nginx + cert-manager + external-dns stack, giving it a stable URL
          # (3dclaw.dublinconsulting.com.br) in place of the installer's throwaway
          # Cloudflare quick tunnel whose *.trycloudflare.com hostname changed on
          # every restart. The openclaw container declares no port for 3001; the
          # Service targets the pod's 3001 directly. NB: the Claw3D process is still
          # unsupervised - a pod restart needs a manual `claw3dctl start` until it is
          # moved to its own Deployment or a lifecycle.postStart hook.
          service:
            # primary: true keeps service.main the primary Service once a second
            # one exists - without it bjw-s app-template (a) renames every
            # Service/Ingress to "openclaw-<identifier>" and (b) repoints the main
            # container's TCP probes from 18789 to the *other* service's port
            # (3001), which nothing in the container listens on, so the pod never
            # goes Ready. forceRename additionally pins the name to "openclaw" so
            # this stays a purely additive change (no prune/recreate of the live
            # gateway Service/Ingress, no openclaw-tls re-issue).
            main:
              primary: true
              forceRename: openclaw
            claw3d:
              controller: main
              ports:
                http:
                  port: 3001
          ingress:
            main:
              enabled: true
              forceRename: openclaw
              className: nginx
              annotations:
                cert-manager.io/cluster-issuer: "letsencrypt"
                external-dns.alpha.kubernetes.io/hostname: dublinconsulting.com.br
                external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
                nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
                nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
                # No nginx Basic auth: the Control UI is a WebSocket-backed SPA and
                # browsers cannot attach an Authorization header to the wss://
                # handshake, so an edge Basic gate 401s the socket and the UI loops
                # on the sign-in prompt. Access is instead enforced by OpenClaw
                # itself: OPENCLAW_GATEWAY_TOKEN (from Vault via openclaw-env-secret)
                # plus per-browser device pairing (`openclaw devices approve`,
                # operator scopes, revocable). The static UI bundle loads without a
                # challenge but is inert until both of those pass.
              hosts:
                - host: openclaw.dublinconsulting.com.br
                  paths:
                    - path: /
                      pathType: Prefix
                      service:
                        identifier: main
                        port: http
              tls:
                - secretName: openclaw-tls
                  hosts:
                    - openclaw.dublinconsulting.com.br
            claw3d:
              enabled: true
              className: nginx
              annotations:
                cert-manager.io/cluster-issuer: "letsencrypt"
                external-dns.alpha.kubernetes.io/hostname: dublinconsulting.com.br
                external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
                # Claw3D streams runtime events over a long-lived connection; match
                # the generous proxy timeouts used for the gateway ingress above.
                nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
                nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
                # No nginx Basic auth here: Claw3D Studio enforces its own access
                # gate (studio_access cookie / device pairing, realm "Claw3D"), so
                # an nginx layer only stacked a second browser prompt. Basic auth
                # is kept on ingress.main (the OpenClaw gateway) only.
              hosts:
                - host: 3dclaw.dublinconsulting.com.br
                  paths:
                    - path: /
                      pathType: Prefix
                      service:
                        identifier: claw3d
                        port: http
              tls:
                - secretName: claw3d-tls
                  hosts:
                    - 3dclaw.dublinconsulting.com.br
          persistence:
            data:
              storageClass: oci-bv
              advancedMounts:
                main:
                  fix-permissions:
                    - path: /home/node/.openclaw
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-agents
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: openclaw
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
