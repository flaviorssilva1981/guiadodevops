  CONTEXT.md: |
    # CONTEXT.md — Base de conhecimento (Dublin Consulting)

    Fonte: https://dublinconsulting.com.br e PRODUCT.md do repositório
    devops-portfolio. Versão de 2026-10-01. Use somente o que está aqui.

    ## Quem somos
    Dublin Consulting — consultoria de **Cloud, DevOps e Kubernetes**.
    Slogan: "Cloud e DevOps inteligentes, operação segura."
    Lema do método: "Diagnosticamos antes de mudar, automatizamos o que se repete
    e operamos com segurança."
    Pilares: Transparência, Colaboração, Autonomia.
    Público: empresas de médio porte no Brasil (CTO, gerente de engenharia, líder
    de TI) com problema de infraestrutura, Kubernetes ou entrega (pipelines).

    ## Fundador
    **Flavio Silva** — Senior DevOps Engineer, 15 anos de experiência, de
    infraestrutura on-premises a modernização cloud/DevOps. Certificações: AWS
    Solutions Architect Associate, Microsoft Azure Fundamentals (AZ-900), Google
    Cloud Digital Leader, Oracle Cloud Infrastructure Architect Associate.
    GitHub: github.com/flaviorssilva1981.

    ## Serviços (7 frentes)
    | Frente | O que cobre |
    |--------|-------------|
    | Cloud & Multi-cloud | Arquitetura, migração e governança em AWS, Azure, Google Cloud e OCI |
    | Kubernetes & Containers | Desenho e operação de clusters EKS, AKS, GKE e OKE; Docker, Helm, Argo CD |
    | CI/CD & Automação | Pipelines em GitHub Actions, Jenkins, Azure DevOps, Bitbucket Pipelines etc. |
    | Infraestrutura como Código | Terraform e Ansible |
    | DevSecOps | Segredos fora do git, RBAC/IAM com menor privilégio, verificações automatizadas (Trivy, SonarQube, HashiCorp Vault) |
    | Observabilidade | Prometheus, Grafana, Zabbix |
    | Soluções de IA | Agentes AIOps, assistentes de voz em tempo real, integração de LLMs (Claude, GPT, Gemini, AWS Bedrock), MCP e RAG |

    ## Método (6 etapas)
    1. Diagnóstico 2. Arquitetura 3. Infraestrutura 4. Automação 5. Testes 6. Entrega.
    Princípios: mudanças reversíveis, plano antes de aplicar (plan antes de
    apply), leitura antes de escrita, segurança por padrão, documentação viva
    para a autonomia do cliente.

    ## Diagnóstico (oferta de entrada)
    - Duração: **5 dias úteis**, com acesso **somente leitura**.
    - Entrega: relatório com riscos priorizados + roadmap de 90 dias.
    - Cobre: arquitetura, segurança, custos, pipelines CI/CD, Kubernetes e
      observabilidade.
    - Investimento: **a partir de R$ 7.500**, para um ambiente em uma cloud; o
      valor é **creditado** se o cliente contratar a implementação.
    - A **primeira conversa de 30 minutos é gratuita**.
    - Existe um relatório de exemplo, com dados fictícios, em
      https://dublinconsulting.com.br/diagnostico-exemplo
    - Qualquer valor diferente disso (outro escopo, mais ambientes, projeto de
      implementação) é com o Flavio — não estime.

    ## Casos entregues (anonimizados — nunca cite clientes)
    - FinOps com governança multi-cloud, tags e controles de custo: cerca de
      **25% de redução** no custo mensal de cloud.
    - Refatoração de VMs para AKS, com infraestrutura como código.
    - Migração de cargas on-premises para a AWS.
    - Agente AIOps para Kubernetes: observa eventos de aviso, faz análise de causa
      raiz com IA e propõe/executa remediação via MCP.
    Não há outros números, setores, prazos ou depoimentos confirmados.

    ## Contato
    - WhatsApp: +55 11 95078-3983 (canal principal)
    - E-mail: flavio.rssilva@gmail.com
    - LinkedIn: Flavio Silva
    - Formulário do site: abre uma conversa pré-preenchida no WhatsApp ou e-mail.
    - Horário de atendimento: não divulgado — não prometa horário de resposta.
    - Privacidade/LGPD: https://dublinconsulting.com.br/privacidade

    ## Perguntas frequentes (respostas aprovadas)
    - **Vocês trabalham com qual cloud?** AWS, Azure, Google Cloud e OCI.
    - **Precisam de acesso ao nosso ambiente?** No Diagnóstico, apenas acesso
      somente leitura; nada é alterado.
    - **Quanto custa?** O Diagnóstico parte de R$ 7.500 (um ambiente, uma cloud),
      creditado se contratar a implementação. Outros escopos: sob análise do Flavio.
    - **Quanto tempo leva?** O Diagnóstico leva 5 dias úteis. Prazos de projetos
      dependem do escopo — o Flavio avalia.
    - **Têm clientes de referência?** Há casos anonimizados (acima); nomes de
      clientes não são divulgados.
    - **Atendem fora de São Paulo?** O WhatsApp é de São Paulo; não há informação
      sobre restrição de região — confirme com o Flavio.
    - **Dão suporte 24x7?** Não há oferta de suporte contínuo/SLA divulgada —
      escalar.

    ## O que NÃO existe nesta base (não afirmar)
    Preços além do Diagnóstico, SLAs, horário de atendimento, nomes de clientes,
    depoimentos, equipe além do fundador, dados de empresa (CNPJ), formas de
    contratação além do Diagnóstico.

