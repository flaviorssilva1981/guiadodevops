apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-basic-auth
  namespace: ai-agents
spec:
  # Basic-auth htpasswd rarely rotates; no need for the 15s cadence the env
  # secret uses.
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: openclaw-basic-auth
    # nginx ingress basic-auth requires an Opaque secret whose single data key
    # is `auth` and whose value is a full htpasswd file.
    template:
      type: Opaque
  data:
    - secretKey: auth
      remoteRef:
        # KV v2 secret at secret/openclaw in Vault, property `basic_auth_htpasswd`.
        # Populate it with bcrypt htpasswd line(s), e.g.:
        #   htpasswd -nbB operator '<strong-password>'
        # (one user per line; -B = bcrypt, which nginx ingress supports).
        # Used by both ingress.main (openclaw.dublinconsulting.com.br) and
        # ingress.claw3d (3dclaw.dublinconsulting.com.br) in
        # applications/tools/openclaw.yaml.
        key: openclaw
        property: basic_auth_htpasswd
