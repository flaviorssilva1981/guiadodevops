apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd     
spec:
  project: core-tools
  source:
    repoURL: harbor.guiadodevops.com
    targetRevision: 0.30.0
    helm:
      values: |-
        server:
          ingress:
            enabled: true
            annotations:
              kubernetes.io/ingress.class: nginx
              cert-manager.io/cluster-issuer: "letsencrypt"
              external-dns.alpha.kubernetes.io/hostname: dublinconsulting.com.br
              external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
              # Origin lock: accept TLS clients only with Cloudflare's origin-pull certificate (mTLS).
              nginx.ingress.kubernetes.io/auth-tls-secret: "security/cloudflare-origin-pull-ca"
              nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
              nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
              nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "false"
            hosts:
              - host: vault.dublinconsulting.com.br
                paths:
                - "/"
            tls:
            - secretName: vault-tls
              hosts:
                - vault.dublinconsulting.com.br
    chart: infra/vault
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true 
      selfHeal: true
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: vault-agent-injector-cfg
      jsonPointers:
        - /webhooks
