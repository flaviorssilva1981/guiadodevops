apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-env-secret
  namespace: ai-agents
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: openclaw-env-secret
  # Expects a KV v2 secret at secret/openclaw in Vault with keys:
  #   REQUESTY_API_KEY, OPENCLAW_GATEWAY_TOKEN, TELEGRAM_BOT_TOKEN
  # (all model calls route through Requesty AI (requesty.ai) rather than Anthropic
  # directly, so no ANTHROPIC_API_KEY is needed here)
  dataFrom:
    - extract:
        key: openclaw
