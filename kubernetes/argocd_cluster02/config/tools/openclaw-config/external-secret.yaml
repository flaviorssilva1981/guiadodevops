apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-env-secret
  namespace: ai-agents
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: openclaw-env-secret
  # Expects a KV v2 secret at secret/openclaw in Vault with keys:
  #   ANTHROPIC_API_KEY, OPENCLAW_GATEWAY_TOKEN, TELEGRAM_BOT_TOKEN
  #   (+ HUBSPOT_CLIENT_ID, HUBSPOT_CLIENT_SECRET: HubSpot MCP connector OAuth app,
  #   used once to seed the MCP OAuth store, see mcp.servers.hubspot in openclaw.yaml)
  # (model calls go direct to api.anthropic.com; the former OPENAI_API_KEY /
  # REQUESTY_API_KEY keys are no longer referenced and can be removed from the
  # Vault secret. dataFrom.extract maps every key in the Vault secret, so adding
  # ANTHROPIC_API_KEY there is the only out-of-band step.)
  dataFrom:
    - extract:
        key: openclaw
