apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-env-secret
  namespace: ai-agents
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: openclaw-env-secret
  # Expects a KV v2 secret at secret/openclaw in Vault with keys:
  #   ANTHROPIC_API_KEY, OPENCLAW_GATEWAY_TOKEN, TELEGRAM_BOT_TOKEN
  # (model calls go directly to the Anthropic API; the former REQUESTY_API_KEY
  # key is no longer referenced and can be removed from the Vault secret)
  dataFrom:
    - extract:
        key: openclaw
