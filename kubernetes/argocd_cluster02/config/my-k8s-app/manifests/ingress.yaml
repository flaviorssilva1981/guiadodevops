apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt"
    external-dns.alpha.kubernetes.io/hostname: myapp.dublinconsulting.com.br
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    # Origin lock: accept TLS clients only with Cloudflare's origin-pull certificate (mTLS).
    nginx.ingress.kubernetes.io/auth-tls-secret: "my-app/cloudflare-origin-pull-ca"
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "false"
spec:
  tls:
    - hosts:
        - myapp.dublinconsulting.com.br
      secretName: myapp-tls
  rules:
    - host: myapp.dublinconsulting.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-app
                port:
                  number: 80
