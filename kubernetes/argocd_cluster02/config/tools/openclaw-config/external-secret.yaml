apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-env-secret
  namespace: ai-agents
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: openclaw-env-secret
  # Expects a KV v2 secret at secret/openclaw in Vault with keys:
  #   REQUESTY_API_KEY, OPENCLAW_GATEWAY_TOKEN, TELEGRAM_BOT_TOKEN
  # (model calls route through router.requesty.ai; the former OPENAI_API_KEY /
  # ANTHROPIC_API_KEY keys are no longer referenced and can be removed from the
  # Vault secret. dataFrom.extract maps every key in the Vault secret, so adding
  # REQUESTY_API_KEY there is the only out-of-band step.)
  dataFrom:
    - extract:
        key: openclaw
